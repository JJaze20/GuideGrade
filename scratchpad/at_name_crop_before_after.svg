<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="260" fill="#ffffff"/>

  <!-- Column boundaries, proportional to AT's real widthFrac values -->
  <!-- Last Name: 0.18223, First Name: 0.16705, MI: 0.06074 (of page width 595.28pt) -->
  <!-- scale: 1pt = 6.0px -->
  <g stroke="#222" stroke-width="2" fill="none">
    <rect x="40" y="40" width="656" height="120"/>
    <line x1="149" y1="40" x2="149" y2="160"/>
    <line x1="249" y1="40" x2="249" y2="160"/>
    <line x1="285" y1="40" x2="285" y2="160"/>
  </g>

  <!-- Printed captions, at the real baseline: box_top + 10pt -> 40 + 60 = 100 -->
  <g fill="#888" font-size="13">
    <text x="46" y="104">Last Name</text>
    <text x="155" y="104">First Name</text>
    <text x="255" y="104">MI</text>
  </g>

  <!-- Handwritten sample, well below the caption -->
  <g fill="#1a1a1a" font-size="26" font-style="italic">
    <text x="50" y="145">Bale</text>
    <text x="160" y="145">Christian</text>
    <text x="258" y="145">Z</text>
  </g>

  <!-- OLD crop: full box (0.10690 -> 0.14729 of page height) -->
  <g>
    <rect x="40" y="40" width="656" height="120" fill="none" stroke="#d64545" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="700" y="55" fill="#d64545" font-size="15" font-weight="bold">OLD</text>
    <text x="700" y="72" fill="#d64545" font-size="11">full box</text>
    <text x="700" y="86" fill="#d64545" font-size="11">(caption</text>
    <text x="700" y="100" fill="#d64545" font-size="11">included)</text>
  </g>

  <!-- NEW crop: top clipped 14pt (84px at 6px/pt) -> starts at 40+84=124, same bottom 160 -->
  <g>
    <rect x="40" y="124" width="656" height="36" fill="none" stroke="#1f9d55" stroke-width="3"/>
    <text x="700" y="135" fill="#1f9d55" font-size="15" font-weight="bold">NEW</text>
    <text x="700" y="152" fill="#1f9d55" font-size="11">caption</text>
    <text x="700" y="166" fill="#1f9d55" font-size="11">clipped</text>
  </g>

  <!-- Dimension callout for the 14pt inset -->
  <g stroke="#333" stroke-width="1">
    <line x1="20" y1="40" x2="20" y2="124"/>
    <line x1="14" y1="40" x2="26" y2="40"/>
    <line x1="14" y1="124" x2="26" y2="124"/>
  </g>
  <text x="0" y="86" fill="#333" font-size="11">14pt</text>

  <text x="40" y="200" fill="#333" font-size="14" font-weight="bold">AT Last Name / First Name / MI row</text>
  <text x="40" y="220" fill="#555" font-size="12">Red dashed = old OCR crop (whole box, caption ink included).</text>
  <text x="40" y="238" fill="#555" font-size="12">Green solid = new OCR crop (top 14pt removed, same width and bottom edge).</text>
</svg>
