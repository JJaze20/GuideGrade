name: generate_sheets
description: >
  Standalone generator for the OMR answer sheets (../answer_sheets/*.pdf)
  and the matching bubble-coordinate data (../lib/core/omr/omr_templates.dart).
  Deliberately isolated from the main app's pubspec.yaml so running it never
  triggers opencv_dart/dartcv4's native build hooks (only relevant to the
  Android app, not this desktop-run script).
publish_to: 'none'

environment:
  sdk: ^3.9.0

dependencies:
  pdf: ^3.11.1
  # Used directly for the AT sheet's rotated margin title (Matrix4/rotateZ)
  # -- otherwise just a transitive dep of pdf, so pin it explicitly now that
  # generate_sheets.dart imports it itself.
  vector_math: ^2.1.4
